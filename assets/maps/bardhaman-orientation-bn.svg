<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="960" height="760" role="img" aria-labelledby="places-map-title places-map-desc" lang="bn" class="places-map-svg">
<title id="places-map-title">বর্ধমানের কেন্দ্রভূমি: নদী ও শহর</title>
<desc id="places-map-desc">জেলার সরকারি মানচিত্র অনুসারে আঞ্চলিক দিকনির্দেশক বিন্যাস। উত্তর-পূর্বে কাটোয়ার কাছে অজয় ভাগীরথীতে মিশেছে। বর্ধমান দামোদরের কাছে; তার পূর্বদিকে ভাগীরথীর তীরে কালনা। উত্তরে বীরভূম, পশ্চিমে পশ্চিম বর্ধমান, দক্ষিণ-পশ্চিমে বাঁকুড়া ও দক্ষিণে হুগলি। প্রশাসনিক বা সমাজের বসতির সীমানা দেখানো হয়নি। নির্দিষ্ট মাপে আঁকা নয়।</desc>
